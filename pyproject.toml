[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waraq"
version = "0.1.1"
description = "Convert a file to Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pro Gineous"}]
dependencies = ["pypdf>=5"]

[project.scripts]
waraq = "waraq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
